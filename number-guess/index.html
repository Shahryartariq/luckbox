<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Number Guess | luckbox</title>
</head>
<body>
  <a href="../" class="back-link">&larr; luckbox</a>

  <h1 class="mainHeading">Guess the Number</h1>
  <p class="text-center text-muted">I picked a number from 0 to 9. You have 5 tries.</p>
  <hr>

  <div class="btnContainer" id="buttons"></div>

  <p class="text-center attempts" id="attempts">Attempts left: 5</p>
  <h2 class="mainHeading" id="result"></h2>

  <div class="text-center">
    <button class="btn btn-success myButton" id="playAgain" hidden>Play again</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
