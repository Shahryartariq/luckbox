<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>luckbox</title>
  <meta name="description" content="Three games of luck in the browser: Rock Paper Scissors, Blackjack and Number Guess.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1720;
      color: #e8edf2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    h1 { font-size: 3rem; letter-spacing: -1px; }
    h1 span { color: #f5b301; }
    .tagline { color: #9aa7b4; margin: 10px 0 40px; text-align: center; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 820px;
    }
    .card {
      background: #18232f;
      border: 1px solid #263545;
      border-radius: 14px;
      padding: 28px 22px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s, border-color .15s;
    }
    .card:hover { transform: translateY(-4px); border-color: #f5b301; }
    .card .icon { font-size: 2.4rem; }
    .card h2 { font-size: 1.25rem; margin: 14px 0 6px; }
    .card p { color: #9aa7b4; font-size: .95rem; line-height: 1.4; }
    footer { margin-top: auto; padding-top: 50px; color: #6b7a89; font-size: .85rem; }
    footer a { color: #9aa7b4; }
  </style>
</head>
<body>
  <h1>luck<span>box</span></h1>
  <p class="tagline">Three games of luck. Pick one and try your odds.</p>

  <main class="games">
    <a class="card" href="rock-paper-scissors/">
      <div class="icon">✊</div>
      <h2>Rock Paper Scissors</h2>
      <p>Pick your move and see if you beat the computer.</p>
    </a>
    <a class="card" href="blackjack/">
      <div class="icon">🃏</div>
      <h2>Blackjack</h2>
      <p>Hit or stand. Get close to 21 without going over.</p>
    </a>
    <a class="card" href="number-guess/">
      <div class="icon">🔢</div>
      <h2>Number Guess</h2>
      <p>Find the secret number from 0 to 9 in five tries.</p>
    </a>
  </main>

  <footer>Built by <a href="https://github.com/Shahryartariq">Shehryar Tariq</a></footer>
</body>
</html>
